<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripNest | Hotels</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f8fafc;color:#111827;}
.topbar{
    padding:18px 8%;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899,#f97316);
}
.logo{font-size:28px;font-weight:700;}
.back{
    text-decoration:none;
    background:white;
    color:#111827;
    padding:10px 20px;
    border-radius:30px;
    font-weight:600;
}
.hero{
    margin:35px 8%;
    border-radius:35px;
    padding:50px;
    color:white;
    background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899,#f97316);
}
.hero h1{font-size:48px;margin-bottom:10px;}
.hero p{font-size:18px;line-height:1.8;}
.grid{
    margin:40px 8%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:25px;
}
.card{
    background:white;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 15px 30px rgba(0,0,0,.08);
    transition:.3s;
}
.card:hover{transform:translateY(-8px);}
.card img{
    width:100%;
    height:240px;
    object-fit:cover;
}
.content{padding:22px;}
.content h3{margin-bottom:10px;}
.price{
    color:#2563eb;
    font-weight:700;
    margin:8px 0;
}
.rating{
    color:#f59e0b;
    margin-bottom:10px;
}
.features{
    color:#64748b;
    line-height:1.8;
    margin-bottom:16px;
}
.btns{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
.btn{
    text-decoration:none;
    padding:10px 18px;
    border-radius:14px;
    font-weight:600;
    color:white;
    background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899);
}
.secondary{
    background:linear-gradient(135deg,#10b981,#059669);
}
.empty{
    margin:80px 8%;
    text-align:center;
    color:#64748b;
    font-size:20px;
}
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">TripNest</div>
    <a href="dashboard.html" class="back">Back</a>
</div>

<section class="hero">
    <h1 id="title">Recommended Hotels</h1>
    <p id="subtitle">
        Best stays curated for your destination.
    </p>
</section>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none;">
    Create a trip first to view destination hotels ✨
</div>

<script>
const destination =
localStorage.getItem("selectedDestination");

const grid =
document.getElementById("grid");

const hotels = {
Goa:[
{
name:"Taj Resort Goa",
img:"https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1200",
price:"₹7,500 / night",
rating:"★★★★★",
features:"Beach View • Pool • Breakfast Included"
},
{
name:"W Goa",
img:"https://images.unsplash.com/photo-1578683010236-d716f9a3f461?q=80&w=1200",
price:"₹14,000 / night",
rating:"★★★★★",
features:"Luxury Stay • Spa • Sea Facing"
},
{
name:"Budget Bay Inn",
img:"https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?q=80&w=1200",
price:"₹2,900 / night",
rating:"★★★★☆",
features:"Affordable • WiFi • City Center"
}
],
Manali:[
{
name:"Snow Peak Resort",
img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1200",
price:"₹5,800 / night",
rating:"★★★★★",
features:"Mountain View • Bonfire • Breakfast"
},
{
name:"Valley Retreat",
img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?q=80&w=1200",
price:"₹3,900 / night",
rating:"★★★★☆",
features:"Scenic Stay • Balcony • Cozy Rooms"
}
],
Maldives:[
{
name:"Ocean Pearl Villas",
img:"https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?q=80&w=1200",
price:"₹25,000 / night",
rating:"★★★★★",
features:"Private Pool • Ocean Deck • Luxury"
},
{
name:"Lagoon Escape",
img:"https://images.unsplash.com/photo-1526772662000-3f88f10405ff?q=80&w=1200",
price:"₹18,500 / night",
rating:"★★★★★",
features:"Overwater Villa • Spa • Fine Dining"
}
]
};

if(!destination){
    document.getElementById("empty").style.display="block";
}else{
    document.getElementById("title").innerText =
    `${destination} Hotels`;

    document.getElementById("subtitle").innerText =
    `Top stays in ${destination}`;

    const list =
    hotels[destination] || [
        {
            name:`Grand ${destination} Hotel`,
            img:"https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=1200",
            price:"₹6,500 / night",
            rating:"★★★★☆",
            features:"Comfort Stay • WiFi • Breakfast"
        }
    ];

    list.forEach(h=>{
        grid.innerHTML += `
            <div class="card">
                <img src="${h.img}">
                <div class="content">
                    <h3>${h.name}</h3>
                    <div class="price">${h.price}</div>
                    <div class="rating">${h.rating}</div>
                    <div class="features">${h.features}</div>

                    <div class="btns">
                        <a class="btn"
                        target="_blank"
                        href="https://www.booking.com">
                        Book Hotel
                        </a>

                        <a class="btn secondary"
                        target="_blank"
                        href="https://www.airbnb.com">
                        Airbnb
                        </a>
                    </div>
                </div>
            </div>
        `;
    });
}
</script>

</body>
</html>
