<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripNest | Itinerary</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f8fafc;color:#111827;}
.topbar{
    padding:18px 8%;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899,#f97316);
}
.logo{font-size:28px;font-weight:700;}
.back{
    text-decoration:none;
    background:white;
    color:#111827;
    padding:10px 20px;
    border-radius:30px;
    font-weight:600;
}
.hero{
    margin:35px 8%;
    padding:50px;
    border-radius:35px;
    color:white;
    background:linear-gradient(135deg,#2563eb,#7c3aed,#ec4899,#f97316);
}
.hero h1{
    font-size:48px;
    margin-bottom:10px;
}
.hero p{
    font-size:18px;
    line-height:1.8;
}
.timeline{
    margin:45px 8%;
    position:relative;
}
.timeline::before{
    content:"";
    position:absolute;
    left:35px;
    top:0;
    bottom:0;
    width:4px;
    border-radius:20px;
    background:linear-gradient(#2563eb,#ec4899);
}
.day{
    position:relative;
    margin-bottom:30px;
    margin-left:80px;
    background:white;
    border-radius:28px;
    padding:28px;
    box-shadow:0 15px 30px rgba(0,0,0,.08);
}
.day::before{
    content:"";
    position:absolute;
    left:-58px;
    top:28px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:#2563eb;
    border:5px solid white;
    box-shadow:0 0 0 6px rgba(37,99,235,.18);
}
.day h3{
    margin-bottom:12px;
    font-size:24px;
}
.day ul{
    padding-left:20px;
    color:#64748b;
    line-height:2;
}
.summary{
    margin:50px 8%;
    background:white;
    border-radius:28px;
    padding:30px;
    box-shadow:0 15px 30px rgba(0,0,0,.08);
    line-height:2;
}
.empty{
    margin:100px 8%;
    text-align:center;
    font-size:20px;
    color:#64748b;
}
@media(max-width:700px){
    .timeline::before{left:15px;}
    .day{
        margin-left:45px;
        padding:22px;
    }
    .day::before{left:-38px;}
    .hero h1{font-size:36px;}
}
</style>
</head>
<body>

<div class="topbar">
    <div class="logo">TripNest</div>
    <a href="dashboard.html" class="back">Back</a>
</div>

<section class="hero">
    <h1 id="title">Smart Itinerary</h1>
    <p id="subtitle">Your personalized detailed travel plan.</p>
</section>

<section class="timeline" id="timeline"></section>
<section class="summary" id="summary"></section>

<div class="empty" id="empty" style="display:none;">
    Create a trip first to generate itinerary ✨
</div>

<script>
const trips = JSON.parse(localStorage.getItem("trips")) || [];
const activities = JSON.parse(localStorage.getItem("selectedActivities")) || [];
const timeline = document.getElementById("timeline");
const summary = document.getElementById("summary");

const destinationPlans = {
Goa:["Airport arrival & hotel check-in","Beachside lunch","Baga Beach sunset walk","Dinner cruise & music night"],
Manali:["Mountain arrival & scenic check-in","Cafe breakfast","Valley sightseeing","Bonfire night stay"],
Paris:["Luxury hotel check-in","Eiffel Tower visit","Cafe lunch","Evening Seine river cruise"],
Maldives:["Villa check-in","Private beach relaxation","Sunset dinner","Spa session"]
};

if(!trips.length){
    document.getElementById("empty").style.display="block";
    timeline.style.display="none";
    summary.style.display="none";
}else{
    const trip = trips[trips.length-1];

    document.getElementById("title").innerText =
    `${trip.destination} Itinerary`;

    document.getElementById("subtitle").innerText =
    `Detailed ${trip.preference} travel experience`;

    const base =
    destinationPlans[trip.destination] ||
    ["Arrival & hotel check-in","Explore city attractions","Experience local culture","Relax and leisure time"];

    const plan = [
        {
            title:"Day 1 — Arrival & Welcome",
            items:base
        },
        {
            title:"Day 2 — Adventure & Exploration",
            items:[
                "Healthy breakfast",
                ...(activities.length ? activities : ["Local sightseeing"]),
                "Lunch at top-rated place",
                "Evening leisure & photography"
            ]
        },
        {
            title:"Day 3 — Culture & Shopping",
            items:[
                "Visit iconic attractions",
                "Local food tasting",
                "Shopping / souvenirs",
                "Night entertainment"
            ]
        },
        {
            title:"Day 4 — Relaxation Day",
            items:[
                "Late breakfast",
                "Spa / relaxation",
                "Free exploration",
                "Memorable dinner"
            ]
        },
        {
            title:"Day 5 — Return Journey",
            items:[
                "Breakfast",
                "Pack & checkout",
                "Airport / station transfer",
                "Return with memories ✨"
            ]
        }
    ];

    plan.forEach(day=>{
        timeline.innerHTML += `
            <div class="day">
                <h3>${day.title}</h3>
                <ul>
                    ${day.items.map(i=>`<li>${i}</li>`).join("")}
                </ul>
            </div>
        `;
    });

    summary.innerHTML = `
        <h2>Trip Summary</h2>
        <p>📍 <b>${trip.destination}</b></p>
        <p>📅 ${trip.startDate} → ${trip.endDate}</p>
        <p>👥 Travelers: <b>${trip.travelers}</b></p>
        <p>🚆 Transport: <b>${trip.transport}</b></p>
        <p>🎯 Travel Style: <b>${trip.preference}</b></p>
        <p>✨ Activities: <b>${activities.length ? activities.join(", ") : "Not selected"}</b></p>
        <p>💰 Budget: <b>₹${Number(trip.budget).toLocaleString()}</b></p>
    `;
}
</script>

</body>
</html>
